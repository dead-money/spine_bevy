name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # Run JS-based actions on Node 24 instead of the deprecated Node 20.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  test:
    name: fmt + clippy + test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout spine_bevy
        uses: actions/checkout@v6
        with:
          path: spine_bevy

      # spine_runtime is a path dependency on a sibling checkout. A PR uses
      # the spine_runtime branch with the same name when one exists, so
      # paired PRs across both repos test together; otherwise main.
      - name: Resolve spine_runtime ref
        id: runtime_ref
        run: |
          branch="${{ github.head_ref }}"
          if [ -z "$branch" ]; then
            echo "ref=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git ls-remote --exit-code --heads \
              https://github.com/dead-money/spine_runtime.git \
              "$branch" >/dev/null 2>&1; then
            echo "Using matching branch $branch on spine_runtime"
            echo "ref=$branch" >> "$GITHUB_OUTPUT"
          else
            echo "No matching branch on spine_runtime; using default"
            echo "ref=" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout spine_runtime
        uses: actions/checkout@v6
        with:
          repository: dead-money/spine_runtime
          path: spine_runtime
          ref: ${{ steps.runtime_ref.outputs.ref }}

      # The examples' rigs. `cargo test` only builds the examples, so
      # nothing in this workflow reads them yet.
      - name: Checkout spine-runtimes (upstream)
        uses: actions/checkout@v6
        with:
          repository: EsotericSoftware/spine-runtimes
          path: spine-runtimes
          # Match spine_runtime's pin (upstream/4.3); bump together.
          ref: ba17cf88b198c6531c6c51d8d4e1e4b3c3ab47dd

      # Needed to build Bevy's wgpu / winit / alsa deps, even headless.
      - name: Install Linux system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev \
            libudev-dev \
            libwayland-dev \
            libxkbcommon-dev \
            libx11-dev \
            libxcursor-dev \
            libxi-dev \
            libxrandr-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            spine_bevy
            spine_runtime

      - name: cargo fmt
        working-directory: spine_bevy
        run: cargo fmt --all --check

      - name: cargo clippy
        working-directory: spine_bevy
        run: cargo clippy --all-targets

      - name: cargo test
        working-directory: spine_bevy
        run: cargo test --all-targets

      - name: cargo doc
        working-directory: spine_bevy
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo doc --no-deps
